<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Траты">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>Траты</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2e38;--tx:#f2f3f5;--mut:#8b90a0;--acc:#4f8cff;--red:#ff5d6c;--grn:#3ecf8e}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--line:#e3e5ec;--tx:#14161c;--mut:#6b7080}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.top button{background:none;border:0;color:var(--tx);font-size:22px;padding:8px 12px;cursor:pointer}
.month{font-weight:600;font-size:18px;text-transform:capitalize}
.total{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.total small{color:var(--mut)}
.total .sum{font-size:34px;font-weight:700;letter-spacing:-.5px}
.bars{margin-top:12px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;font-size:14px}
.bar .t{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bar span:last-child{color:var(--mut);min-width:70px;text-align:right}
h3{margin:18px 4px 8px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.tx{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.tx .ic{font-size:24px;text-align:center}
.tx .n{font-weight:500}
.tx .m{font-size:12px;color:var(--mut)}
.tx .a{font-weight:600;text-align:right}
.tx .x{display:block;background:none;border:0;color:var(--mut);font-size:12px;padding:2px 0 0;margin-left:auto;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;gap:10px}
.fab button{border:0;border-radius:28px;height:56px;padding:0 20px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.fab .add{background:var(--acc);color:#fff;font-size:26px;width:56px;padding:0}
.fab .scan{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:10}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.panel h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 2px 4px}
input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-size:14px;cursor:pointer}
.cats button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:8px;margin-top:14px}
.row button,.btn{flex:1;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--tx);border:1px solid var(--line)}
.row .pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.hint{font-size:12px;color:var(--mut);margin-top:6px;word-break:break-all}
.gear{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--grn);color:#04210f;padding:10px 16px;border-radius:20px;font-weight:600;display:none;z-index:20}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button id="prev">‹</button>
    <div class="month" id="month"></div>
    <button id="next">›</button>
  </div>
  <div class="total"><small>Потрачено за месяц</small><div class="sum" id="sum">0</div><div class="bars" id="bars"></div></div>
  <h3>Операции</h3>
  <div id="list"></div>
</div>

<div class="fab">
  <button class="scan" id="scan">📷 Чек</button>
  <button class="add" id="addBtn">+</button>
</div>
<input type="file" id="file" accept="image/*" capture="environment" hidden>

<!-- add/edit sheet -->
<div class="sheet" id="sheet"><div class="panel">
  <h2 id="sheetTitle">Новая трата</h2>
  <label>Сумма</label><input id="fAmount" inputmode="decimal" placeholder="0.00">
  <label>Название / магазин</label><input id="fNote" placeholder="Например, Пятёрочка">
  <label>Категория</label><div class="cats" id="fCats"></div>
  <label>Дата</label><input id="fDate" type="date">
  <div class="hint" id="ocrHint"></div>
  <div class="row"><button id="fCancel">Отмена</button><button class="pri" id="fSave">Сохранить</button></div>
</div></div>

<!-- settings sheet -->
<div class="sheet" id="set"><div class="panel">
  <h2>Настройки</h2>
  <label>Валюта (символ)</label><input id="sCur" maxlength="4">
  <label>Новая категория</label>
  <div style="display:flex;gap:8px"><input id="sEmoji" maxlength="2" placeholder="🙂" style="width:70px"><input id="sName" placeholder="Название"><button class="btn" id="sAdd" style="flex:0 0 auto">+</button></div>
  <label>Категории (нажми, чтобы удалить)</label><div class="cats" id="sCats"></div>
  <label>Ссылка для Apple Pay автоматизации</label>
  <input id="sLink" readonly>
  <div class="hint">Подставь в «Быстрые команды» → Автоматизация → Транзакция → «Открыть URL». Подробности в README.</div>
  <div class="row"><button id="exp">Экспорт</button><button id="imp">Импорт</button></div>
  <input type="file" id="impFile" accept="application/json" hidden>
  <div class="row"><button class="pri" id="sClose">Готово</button></div>
</div></div>
<button class="top gear" id="gear" style="background:none;border:0;font-size:22px;color:var(--tx)">⚙︎</button>
<div id="toast"></div>

<script>
const KEY='fin.v1';
const DEF_CATS=[['🛒','Продукты'],['🍽️','Кафе и рестораны'],['🚕','Транспорт'],['🏠','Жильё'],['💊','Здоровье'],['🎬','Развлечения'],['👕','Одежда'],['📱','Связь и подписки'],['🎁','Подарки'],['📦','Другое']];
const RULES={'Продукты':/пятёрочка|пятерочка|магнит|перекрёсток|перекресток|лента|дикси|вкусвилл|ашан|market|grocery|supermarket|spar|lidl|aldi|tesco|walmart|costco/i,
'Кафе и рестораны':/кафе|ресторан|coffee|кофе|starbucks|mcdonald|burger|kfc|pizza|пицц|sushi|суши|bar\b|бар\b|cafe|restaurant/i,
'Транспорт':/taxi|такси|uber|bolt|яндекс.?go|metro|метро|азс|fuel|shell|bp\b|lukoil|парков|parking|rail|ржд/i,
'Здоровье':/аптек|pharm|clinic|клиник|стоматолог|dental/i,
'Связь и подписки':/netflix|spotify|apple\.com|icloud|google|youtube|мтс|билайн|мегафон|tele2|yota|subscription/i,
'Развлечения':/cinema|кино|steam|playstation|xbox|театр|concert/i,
'Одежда':/zara|h&m|uniqlo|wildberries|lamoda|nike|adidas|одежд/i};
let S=load();
let view=new Date(); view.setDate(1);
let editId=null, selCat=null;

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tx)return s}catch(e){}return{tx:[],cats:DEF_CATS.map(([e,n])=>({e,n})),cur:'$'}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=n=>n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+S.cur;
const catIcon=n=>(S.cats.find(c=>c.n===n)||{e:'📦'}).e;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function guessCat(text){for(const [c,re] of Object.entries(RULES)){if(re.test(text||'')&&S.cats.some(x=>x.n===c))return c}return S.cats.some(x=>x.n==='Другое')?'Другое':S.cats[S.cats.length-1]?.n}
function parseAmount(v){const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:NaN}

function render(){
  $('month').textContent=view.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const ym=view.getFullYear()+'-'+String(view.getMonth()+1).padStart(2,'0');
  const items=S.tx.filter(t=>t.date.startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const total=items.reduce((s,t)=>s+t.amount,0);
  $('sum').textContent=fmt(total);
  const by={};items.forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const max=Math.max(0,...Object.values(by));
  $('bars').innerHTML=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="bar"><span>${catIcon(c)}</span><div class="t"><i style="width:${max?v/max*100:0}%"></i></div><span>${fmt(v)}</span></div>`).join('');
  if(!items.length){$('list').innerHTML='<div class="empty">Пока пусто.<br>Нажми + или сфотографируй чек.</div>';return}
  let lastDay='',h='';
  for(const t of items){
    if(t.date!==lastDay){lastDay=t.date;h+=`<h3>${new Date(t.date+'T00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'short'})}</h3>`}
    const src={applepay:' · Apple Pay',receipt:' · чек'}[t.src]||'';
    h+=`<div class="tx" data-id="${t.id}"><div class="ic">${catIcon(t.cat)}</div><div><div class="n">${esc(t.note||t.cat)}</div><div class="m">${esc(t.cat)}${src}</div></div><div><div class="a">${fmt(t.amount)}</div><button class="x" data-del="${t.id}">удалить</button></div></div>`;
  }
  $('list').innerHTML=h;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- add/edit
function drawCats(){$('fCats').innerHTML=S.cats.map(c=>`<button data-c="${esc(c.n)}" class="${c.n===selCat?'on':''}">${c.e} ${esc(c.n)}</button>`).join('')}
function openSheet(pref={},id=null){
  editId=id;$('sheetTitle').textContent=id?'Правка':'Новая трата';
  $('fAmount').value=pref.amount??'';$('fNote').value=pref.note??'';$('fDate').value=pref.date||today();
  selCat=pref.cat||guessCat(pref.note);$('ocrHint').textContent=pref.hint||'';
  drawCats();$('sheet').classList.add('on');if(!pref.amount)setTimeout(()=>$('fAmount').focus(),50);
}
$('addBtn').onclick=()=>openSheet();
$('fCats').onclick=e=>{const b=e.target.closest('button');if(!b)return;selCat=b.dataset.c;drawCats()};
$('fCancel').onclick=()=>$('sheet').classList.remove('on');
$('fSave').onclick=()=>{
  const amount=parseAmount($('fAmount').value);
  if(!(amount>0)){toast('Введи сумму');return}
  const rec={amount,note:$('fNote').value.trim(),cat:selCat,date:$('fDate').value||today()};
  if(editId){Object.assign(S.tx.find(t=>t.id===editId),rec)}
  else S.tx.push({id:uid(),src:pendingSrc||'manual',...rec});
  pendingSrc=null;save();$('sheet').classList.remove('on');
  const d=new Date(rec.date+'T00:00');view=new Date(d.getFullYear(),d.getMonth(),1);render();
};
let pendingSrc=null;
$('list').onclick=e=>{
  const d=e.target.closest('[data-del]');
  if(d){if(confirm('Удалить трату?')){S.tx=S.tx.filter(t=>t.id!==d.dataset.del);save();render()}return}
  const r=e.target.closest('.tx');if(r){const t=S.tx.find(x=>x.id===r.dataset.id);openSheet(t,t.id)}
};
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};

// ---- receipt OCR (Tesseract.js, всё локально в браузере)
let tessLoading=null;
function loadTess(){return tessLoading||(tessLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('Не удалось загрузить OCR (нужен интернет)'));document.head.appendChild(s)}))}
function parseReceipt(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const nums=l=>(l.match(/\d{1,3}(?:[ \u00a0]?\d{3})*[.,]\d{2}(?!\d)/g)||[]).map(x=>parseAmount(x.replace(/[\s\u00a0]/g,'')));
  let amount=NaN;
  const key=/итог|к оплате|к уплате|всего|сумма|total|amount due|balance due|grand/i;
  const cand=[];
  lines.forEach(l=>{if(key.test(l)&&!/ндс|vat|tax|налог|скидк/i.test(l))cand.push(...nums(l))});
  if(cand.length)amount=Math.max(...cand);
  else{const all=lines.flatMap(nums);if(all.length)amount=Math.max(...all)}
  const merchant=(lines.find(l=>/[A-Za-zА-Яа-я]{3,}/.test(l)&&!/^\d/.test(l))||'').slice(0,40);
  let date;const m=text.match(/(\d{2})[.\/-](\d{2})[.\/-](\d{4}|\d{2})/);
  if(m){let y=m[3].length===2?'20'+m[3]:m[3];const iso=`${y}-${m[2]}-${m[1]}`;if(!isNaN(new Date(iso)))date=iso}
  return{amount:isFinite(amount)?amount:'',note:merchant,date};
}
$('scan').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  toast('Распознаю чек…');
  try{
    await loadTess();
    const {data}=await Tesseract.recognize(f,'rus+eng');
    const r=parseReceipt(data.text);
    pendingSrc='receipt';
    openSheet({...r,hint:'Распознано автоматически — проверь сумму и название.'});
  }catch(err){toast(err.message||'Ошибка распознавания');pendingSrc=null}
};

// ---- settings
function drawSet(){
  $('sCur').value=S.cur;
  $('sCats').innerHTML=S.cats.map(c=>`<button data-n="${esc(c.n)}">${c.e} ${esc(c.n)} ✕</button>`).join('');
  $('sLink').value=location.origin+location.pathname+'#add?amount=AMOUNT&merchant=MERCHANT';
}
$('gear').onclick=()=>{drawSet();$('set').classList.add('on')};
$('sClose').onclick=()=>{S.cur=$('sCur').value||'$';save();$('set').classList.remove('on');render()};
$('sAdd').onclick=()=>{const n=$('sName').value.trim();if(!n||S.cats.some(c=>c.n===n))return;S.cats.push({e:$('sEmoji').value||'🔹',n});$('sName').value='';$('sEmoji').value='';save();drawSet()};
$('sCats').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(S.cats.length<=1)return;if(confirm('Удалить категорию «'+b.dataset.n+'»? Старые траты сохранятся.')){S.cats=S.cats.filter(c=>c.n!==b.dataset.n);save();drawSet()}};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='finance-backup-'+today()+'.json';a.click()};
$('imp').onclick=()=>$('impFile').click();
$('impFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.tx||!d.cats)throw 0;if(confirm('Заменить текущие данные импортируемыми?')){S=d;save();drawSet();render()}}catch(_){toast('Неверный файл')}e.target.value=''};

// ---- Apple Pay / URL: #add?amount=12.5&merchant=Starbucks[&cat=Кафе][&date=2026-11-03]
function handleHash(){
  if(!location.hash.startsWith('#add'))return;
  const p=new URLSearchParams(location.hash.split('?')[1]||'');
  history.replaceState(null,'',location.pathname);
  const amount=parseAmount((p.get('amount')||'').replace(/[^\d.,-]/g,''));
  const note=(p.get('merchant')||p.get('note')||'').trim();
  if(!(amount>0)){
    // нет суммы (например, триггер «поднесение карты») — открываем форму, остаётся ввести сумму
    pendingSrc='applepay';
    openSheet({note,hint:'Оплата Apple Pay — введи сумму.'});
    return;
  }
  const cat=S.cats.some(c=>c.n===p.get('cat'))?p.get('cat'):guessCat(note);
  const date=/^\d{4}-\d{2}-\d{2}$/.test(p.get('date')||'')?p.get('date'):today();
  S.tx.push({id:uid(),src:'applepay',amount:Math.abs(amount),note,cat,date});save();
  view=new Date(new Date(date+'T00:00').getFullYear(),new Date(date+'T00:00').getMonth(),1);
  render();toast('Записано: '+fmt(Math.abs(amount)));
}
window.addEventListener('hashchange',handleHash);
render();handleHash();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
